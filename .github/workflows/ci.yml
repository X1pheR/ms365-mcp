name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify metadata and dependency audit
        shell: bash
        run: |
          set -euo pipefail
          distribution_version="$(node -p "require('./package.json').version")"
          upstream_version="$(node -p "require('./package.json').dependencies['@softeria/ms-365-mcp-server']")"
          test "$distribution_version" = "0.143.0-x1pher.1"
          test "$upstream_version" = "0.143.0"
          npm audit --omit=dev --package-lock-only --audit-level=moderate

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg VERSION="$(node -p "require('./package.json').version")" \
            --build-arg REVISION="$GITHUB_SHA" \
            -t ms365-mcp:ci \
            .

      - name: Verify image contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint node ms365-mcp:ci -p "require('/app/node_modules/@softeria/ms-365-mcp-server/package.json').version")" = "0.143.0"
          docker run --rm ms365-mcp:ci --help >/dev/null
          test "$(docker image inspect ms365-mcp:ci --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = "https://github.com/X1pheR/ms365-mcp"
          test "$(docker image inspect ms365-mcp:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
